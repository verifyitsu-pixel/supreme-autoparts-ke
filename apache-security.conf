# Defense in depth for files that must never be served or executed as uploads.
<Directory /var/www/html>
    Options -Indexes
</Directory>
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
<FilesMatch "(?i)^(wp-config\.php|debug\.log|\.env.*|.*\.(sql|bak|old|orig|swp))$">
    Require all denied
</FilesMatch>
<IfModule mod_headers.c>
    Header always unset X-Powered-By
</IfModule>
