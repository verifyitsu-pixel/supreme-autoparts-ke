name: Test and deploy to Contabo

# Pushes to main run the test gate. Only if it passes is the code (themes, plugins,
# mu-plugins only; never database, uploads or env) sent to the live Contabo store
# through a restricted deploy key. Rollback: revert the commit (or re-run this workflow
# on an older commit); the server also keeps the last 7 pre-deploy code backups.
on:
  push:
    branches: [main]
  # Every push to main is tested; a push that changes no deployed code deploys nothing
  # (the server compares and skips). So docs/tests/scripts/data-only commits never touch the live site.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contabo-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax (all deployed code)
        run: |
          php -v
          find wp-content healthz.php -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Regression tests (isolated, no network, no payments)
        run: |
          set -e
          for t in careers-payment-regression careers-provider-verification-regression careers-redirect-contract-regression careers-terms-presentation-regression catalog-display-currency-regression feed-stream-regression hold-review-presentation-regression kenya-market-regression native-email-wording-regression open-pay-gateway-regression order-email-family-regression order-email-transport-brand-regression order-reference-regression paid-confirmation-routing-regression payment-visibility-regression paystack-availability-regression paystack-card-display-regression processor-billing-prefill-regression product-card-shipping-copy-regression product-image-policy-regression storefront-region-regression whop-express-quote-regression whop-payment-validation-regression manual-confirmation-resend-regression order-experience-regression security-regression whop-limit-visibility-regression page-cache-warm-regression cart-login-persistence-regression otp-mail-failure-regression photo-registry-regression special-order-regression special-order-eta-regression gcr-special-order-regression cart-name-label-regression checkout-label-clamp-regression import-lookup-regression order-status-counter-regression bounded-term-recount-regression shipping-policy-regression; do
            echo "== $t"; php tests/$t.php
          done

      - name: GA4 event tests (no network)
        run: |
          node --version
          node tests/ga4-commerce-regression.cjs
          php tests/ga4-payload-regression.php
          php tests/advanced-cache-bypass-regression.php
          node tests/order-experience-client-regression.js
          node tests/order-experience-loading-regression.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy code to Contabo (restricted deploy key, code-only)
        env:
          DEPLOY_KEY: ${{ secrets.CONTABO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/contabo_deploy
          chmod 600 ~/.ssh/contabo_deploy
          echo '5.183.33.198 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEchn3QiVLJ79JpOoisFz0BCm6vKPi6YzoUGXsyo6a6D' > ~/.ssh/contabo_known_hosts
          echo "$GITHUB_SHA" > .deploy-sha
          tar c .deploy-sha wp-content/themes/supreme-autoparts wp-content/plugins/supreme-autoparts-core wp-content/plugins/woo-paystack wp-content/plugins/whop-payments wp-content/plugins/sa-brevo-mail wp-content/plugins/sa-geo-currency wp-content/plugins/pesapal-woocommerce wp-content/plugins/transactworld-payment-integration wp-content/plugins/supreme-agent-intake wp-content/plugins/supreme-marketing wp-content/mu-plugins wp-content/advanced-cache.php healthz.php llms.txt llms-full.txt 602ba228c9d1427d2c329ca9d9c82c4a.txt | ssh -i ~/.ssh/contabo_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/contabo_known_hosts -o ConnectTimeout=20 deploy@5.183.33.198 deploy
