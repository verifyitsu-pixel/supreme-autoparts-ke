name: Session native harness (non-deploy)

# Feasibility harness only. Runs on harness/** branches or manually. Uses a throwaway MySQL
# service and a clean WordPress + pinned WooCommerce. No secrets, no production data, no
# deploy step. It never runs from main, so the Contabo deploy workflow is unaffected.
on:
  push:
    branches: ['harness/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring
          tools: wp-cli
      - name: Install WordPress + WooCommerce 11.1.0 (throwaway DB)
        run: |
          mkdir /tmp/wp && cd /tmp/wp
          wp core download --quiet
          wp config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --quiet
          wp core install --url=http://localhost --title=t --admin_user=a --admin_password=a --admin_email=a@example.com --skip-email --quiet
          wp plugin install woocommerce --version=11.1.0 --activate --quiet
          wp wc --info >/dev/null 2>&1 || true
          wp plugin list
      - name: Baseline stock-handler lost-update probe (informational)
        run: |
          cd /tmp/wp
          bash "$GITHUB_WORKSPACE/tests/native-harness/run-baseline.sh" "$GITHUB_WORKSPACE/tests/native-harness"
