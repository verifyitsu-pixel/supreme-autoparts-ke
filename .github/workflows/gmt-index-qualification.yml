name: Synthetic GMT index qualification
on:
  push:
    branches: ['test/gmt-index-qualification']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:9.7.2@sha256:e2fa358a74ac81148e7e27d9433e4c0ab62133de8ea4428b4f39a51a4ba7d07f
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only
          MYSQL_DATABASE: gmt_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -psynthetic-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pymysql
      - run: python tests/integration/gmt-index-qualification.py
        env:
          MYSQL_TEST_PASSWORD: synthetic-ci-only
      - run: python tests/integration/gmt-package-qualification.py
        env:
          MYSQL_TEST_PASSWORD: synthetic-ci-only
      - run: python tests/integration/residual-query-qualification.py
        env:
          MYSQL_TEST_PASSWORD: synthetic-ci-only
      - run: python tests/integration/search-traversal-qualification.py
        env:
          MYSQL_TEST_PASSWORD: synthetic-ci-only
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - run: php -l tests/integration/search-php-harness.php && python tests/integration/search-php-qualification.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fake-gmt-qualification-reports
          path: |
            /tmp/gmt*-report.json
            /tmp/residual-query-report.json
            /tmp/search-traversal-report.json
            /tmp/search-php-report.json
            /tmp/search-builder-candidate.php
          retention-days: 7
