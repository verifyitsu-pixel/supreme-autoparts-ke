name: Catalog draft staging integration (test only)
on:
  push:
    branches: ['ci/catalog-draft-staging']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Standalone regression
        run: |
          php -l wp-content/plugins/supreme-autoparts-core/includes/import-shopify.php
          php tests/term-count-readonly-regression.php
          php tests/import-new-only-staging-regression.php
          SA_TEST_NONCLI=1 php tests/import-new-only-staging-regression.php
          php tests/exact-fitment-regression.php
          php tests/aqua-activation-regression.php
          php tests/campaign-unknown-lead-regression.php
          php tests/feed-unknown-lead-hold-regression.php
          php tests/feed-reviewed-image-regression.php
          php tests/kenya-market-regression.php
          php tests/product-image-policy-regression.php
          php tests/photo-registry-regression.php
      - name: Isolated native WordPress WooCommerce MySQL draft import
        run: bash tests/integration/catalog-staging-integration.sh

      - name: Save isolated native callback render evidence
        uses: actions/upload-artifact@v4
        with:
          name: garage-native-render
          path: /tmp/garage-native-*.html
          if-no-files-found: error
          retention-days: 7
